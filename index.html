<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Seguidores</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tu CSS personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Comparador de Seguidores</h1>

    <form onsubmit="comparar(); return false;" class="mb-3">
      <div class="mb-3">
        <label class="form-label">Usuarios que sigues:</label>
        <textarea id="seguidos" class="form-control" rows="6" placeholder="Pega aquí tu lista de seguidos..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Usuarios que te siguen:</label>
        <textarea id="seguidores" class="form-control" rows="6" placeholder="Pega aquí tu lista de seguidores..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary me-2">Comparar</button>
      <button type="button" class="btn btn-success me-2" onclick="exportarResultado()">Exportar</button>
      <button type="button" class="btn btn-secondary" onclick="copiarResultado()">Copiar</button>
    </form>

    <div id="alerta" class="text-danger fw-bold mb-3"></div>

    <h2>No me siguen (<span id="contador">0</span>):</h2>
    <ul id="resultado" class="list-group" style="max-height:300px; overflow-y:auto;"></ul>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>

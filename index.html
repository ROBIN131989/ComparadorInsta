<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comparador de Seguidores</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
font-family:Arial, sans-serif;
margin:20px;
}
</style>

</head>

<body id="body" class="bg-light text-dark">

<div class="container">

<h1 class="mb-4">Comparador de Seguidores</h1>

<p id="alerta" class="text-danger fw-bold"></p>

<!-- LISTAS -->
<div class="row">

<div class="col-md-6">
<h5>Seguidos (<span id="contadorSeguidos">0</span>)</h5>
<textarea id="seguidos" class="form-control" rows="10"></textarea>
</div>

<div class="col-md-6">
<h5>Seguidores (<span id="contadorSeguidores">0</span>)</h5>
<textarea id="seguidores" class="form-control" rows="10"></textarea>
</div>

</div>

<br>

<!-- BOTONES PRINCIPALES -->
<button onclick="comparar()" class="btn btn-primary">Comparar</button>
<button onclick="exportarResultado()" class="btn btn-success">Exportar</button>
<button onclick="copiarResultado()" class="btn btn-secondary">Copiar</button>
<button onclick="ordenarResultados()" class="btn btn-info">Ordenar</button>
<button onclick="cambiarTema()" class="btn btn-dark">Modo Oscuro</button>
<button onclick="borrarResultados()" class="btn btn-warning">Vaciar comparación</button>
<button onclick="borrarTodo()" class="btn btn-danger">Borrar todo</button>

<hr>

<!-- BUSCADOR -->
<input type="text" id="buscador" class="form-control mb-3"
placeholder="Buscar usuario..."
oninput="buscarResultado()">

<!-- RESULTADOS -->
<h4>Resultados (<span id="contador">0</span>)</h4>

<ul id="resultado" class="list-group"></ul>

</div>

<!-- TU SCRIPT -->
<script src="app.js"></script>

</body>
</html>
